name: ios-build

# Builds an unsigned iOS IPA of Harbor on a macOS runner.
# Trigger it from the Actions tab or with:
#   gh workflow run ios-build.yml
# The resulting artifact (Harbor_<version>_unsigned.ipa) can be installed by
# re-signing with your own Apple ID via AltStore, Sideloadly or Xcode.

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: iOS (aarch64-apple-ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
          key: ios

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Initialize iOS project
        run: pnpm tauri ios init --ci

      # libmpv (MPVKit) powers the native-player plugin. swift-rs' CLI build
      # cannot consume binary SwiftPM targets, so the plugin compiles against a
      # vendored mpv/client.h and the mpv symbols bind at load time (build.rs
      # uses -undefined dynamic_lookup). The real libmpv + all its dependencies
      # (ffmpeg, libplacebo, MoltenVK, libass, …) are pulled in as a normal
      # SwiftPM package on the APP target, which Xcode resolves — that is the
      # only sane way to assemble MPVKit's ~two dozen binary xcframeworks.
      - name: Add MPVKit Swift package to the app
        run: |
          ruby -ryaml -e '
            path = "src-tauri/gen/apple/project.yml"
            y = YAML.load_file(path)
            (y["packages"] ||= {})["MPVKit"] =
              { "url" => "https://github.com/mpvkit/MPVKit", "exactVersion" => "0.41.0" }
            name, target = y["targets"].find { |k, _| k.end_with?("_iOS") }
            raise "no iOS target found" unless target
            deps = (target["dependencies"] ||= [])
            deps << { "package" => "MPVKit", "product" => "MPVKit" }
            settings = (target["settings"] ||= {})
            base = (settings["base"] ||= {})
            base["LD_RUNPATH_SEARCH_PATHS"] = "$(inherited) @executable_path/Frameworks"
            File.write(path, y.to_yaml)
            puts "added MPVKit package to #{name}"
          '
          brew install xcodegen
          (cd src-tauri/gen/apple && xcodegen generate)

      - name: Restore app icons
        run: |
          ICONSET=$(find src-tauri/gen/apple -type d -name 'AppIcon.appiconset' | head -1)
          if [ -n "$ICONSET" ] && [ -d src-tauri/icons/ios ]; then
            cp src-tauri/icons/ios/*.png "$ICONSET"/ || true
          fi

      - name: Patch Info.plist (URL schemes, ATS, local network, background audio)
        run: |
          PLIST=$(find src-tauri/gen/apple -maxdepth 2 -name Info.plist | head -1)
          echo "Patching $PLIST"
          python3 - "$PLIST" <<'EOF'
          import plistlib, sys

          path = sys.argv[1]
          with open(path, "rb") as f:
              info = plistlib.load(f)

          # Deep links: harbor:// and stremio:// open the app.
          info["CFBundleURLTypes"] = [
              {
                  "CFBundleURLName": "app.harbor",
                  "CFBundleURLSchemes": ["harbor", "stremio"],
              }
          ]

          # Stremio addons and LAN devices are frequently plain HTTP.
          info["NSAppTransportSecurity"] = {
              "NSAllowsArbitraryLoads": True,
              "NSAllowsLocalNetworking": True,
          }

          # Cast discovery (Chromecast/AirPlay/DLNA/Roku) on the LAN.
          info["NSLocalNetworkUsageDescription"] = (
              "Harbor discovers cast targets like Chromecast, AirPlay, DLNA "
              "and Roku devices on your local network."
          )
          info["NSBonjourServices"] = [
              "_googlecast._tcp",
              "_airplay._tcp",
              "_raop._tcp",
          ]

          # Keep audio running when the app is backgrounded during playback.
          modes = set(info.get("UIBackgroundModes", []))
          modes.add("audio")
          info["UIBackgroundModes"] = sorted(modes)

          # Downloads land in the app's Documents folder; expose it in Files.
          info["UIFileSharingEnabled"] = True
          info["LSSupportsOpeningDocumentsInPlace"] = True

          # Allow rotating into landscape (the player locks itself there).
          orientations = [
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          ]
          info["UISupportedInterfaceOrientations"] = orientations
          info["UISupportedInterfaceOrientations~ipad"] = orientations

          with open(path, "wb") as f:
              plistlib.dump(info, f)
          print("Info.plist patched")
          EOF

      # --no-sign skips codesigning and packages an unsigned IPA. Building
      # through the tauri CLI (instead of raw xcodebuild) is required: the
      # Xcode "Build Rust Code" phase talks back to the CLI's options server.
      - name: Build unsigned IPA
        run: pnpm tauri ios build --no-sign -v

      - name: Collect IPA
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          IPA=$(find src-tauri/gen/apple -name '*.ipa' | head -1)
          echo "IPA: $IPA"
          mkdir -p dist-ipa
          cp "$IPA" "dist-ipa/Harbor_${VERSION}_unsigned.ipa"
          ls -la dist-ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbor-ios
          path: dist-ipa/*.ipa
          retention-days: 14
          if-no-files-found: error
