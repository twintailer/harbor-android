name: ios-build

# Builds an unsigned iOS IPA of Harbor on a macOS runner.
# Trigger it from the Actions tab or with:
#   gh workflow run ios-build.yml
# The resulting artifact (Harbor_<version>_unsigned.ipa) can be installed by
# re-signing with your own Apple ID via AltStore, Sideloadly or Xcode.

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: iOS (aarch64-apple-ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
          key: ios

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Initialize iOS project
        run: pnpm tauri ios init --ci

      # MobileVLCKit powers the native-player plugin. SwiftPM's CLI build
      # (used by swift-rs during cargo build) cannot consume binary
      # xcframework targets, so the plugin only compiles against interop
      # declarations. Extract the device slice to a fixed path: the plugin's
      # build.rs links it during cargo build, and the Xcode project links it
      # for the final app (project.yml patch + regenerate).
      - name: Add MobileVLCKit framework
        run: |
          curl -L -o vlckit.zip "https://github.com/tylerjonesio/vlckit-spm/releases/download/3.6.0/VLCKit-all.xcframework.zip"
          echo "5da4747e001900bbb4153f58db2be4695096c9c2350aea00376ad67b39c053f6  vlckit.zip" | shasum -a 256 -c -
          unzip -q vlckit.zip -d vlckit-tmp
          SLICE=$(find vlckit-tmp -type d -name 'MobileVLCKit.framework' -path '*ios-arm64*' ! -path '*simulator*' | head -1)
          echo "Device slice: $SLICE"
          test -n "$SLICE"
          mkdir -p src-tauri/frameworks-ios
          cp -R "$SLICE" src-tauri/frameworks-ios/
          rm -rf vlckit-tmp vlckit.zip
          ruby -ryaml -e '
            path = "src-tauri/gen/apple/project.yml"
            y = YAML.load_file(path)
            name, target = y["targets"].find { |k, _| k.end_with?("_iOS") }
            raise "no iOS target found" unless target
            target["dependencies"] ||= []
            # MobileVLCKit is a dynamic framework: link AND embed it, or the
            # app aborts at launch with dyld "Library not loaded".
            target["dependencies"] << { "framework" => "../../frameworks-ios/MobileVLCKit.framework", "embed" => true, "codeSign" => false }
            settings = (target["settings"] ||= {})
            base = (settings["base"] ||= {})
            base["LD_RUNPATH_SEARCH_PATHS"] = "$(inherited) @executable_path/Frameworks"
            flags = base["OTHER_LDFLAGS"] || "$(inherited)"
            base["OTHER_LDFLAGS"] = flags + " -lc++ -lxml2 -lz -lbz2 -liconv" \
              " -framework QuartzCore -framework CoreText -framework AVFoundation" \
              " -framework Security -framework CFNetwork -framework AudioToolbox" \
              " -framework OpenGLES -framework CoreGraphics -framework VideoToolbox" \
              " -framework CoreMedia"
            File.write(path, y.to_yaml)
            puts "patched target #{name}"
          '
          brew install xcodegen
          (cd src-tauri/gen/apple && xcodegen generate)

      - name: Restore app icons
        run: |
          ICONSET=$(find src-tauri/gen/apple -type d -name 'AppIcon.appiconset' | head -1)
          if [ -n "$ICONSET" ] && [ -d src-tauri/icons/ios ]; then
            cp src-tauri/icons/ios/*.png "$ICONSET"/ || true
          fi

      - name: Patch Info.plist (URL schemes, ATS, local network, background audio)
        run: |
          PLIST=$(find src-tauri/gen/apple -maxdepth 2 -name Info.plist | head -1)
          echo "Patching $PLIST"
          python3 - "$PLIST" <<'EOF'
          import plistlib, sys

          path = sys.argv[1]
          with open(path, "rb") as f:
              info = plistlib.load(f)

          # Deep links: harbor:// and stremio:// open the app.
          info["CFBundleURLTypes"] = [
              {
                  "CFBundleURLName": "app.harbor",
                  "CFBundleURLSchemes": ["harbor", "stremio"],
              }
          ]

          # Stremio addons and LAN devices are frequently plain HTTP.
          info["NSAppTransportSecurity"] = {
              "NSAllowsArbitraryLoads": True,
              "NSAllowsLocalNetworking": True,
          }

          # Cast discovery (Chromecast/AirPlay/DLNA/Roku) on the LAN.
          info["NSLocalNetworkUsageDescription"] = (
              "Harbor discovers cast targets like Chromecast, AirPlay, DLNA "
              "and Roku devices on your local network."
          )
          info["NSBonjourServices"] = [
              "_googlecast._tcp",
              "_airplay._tcp",
              "_raop._tcp",
          ]

          # Keep audio running when the app is backgrounded during playback.
          modes = set(info.get("UIBackgroundModes", []))
          modes.add("audio")
          info["UIBackgroundModes"] = sorted(modes)

          # Allow rotating into landscape (the player locks itself there).
          orientations = [
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          ]
          info["UISupportedInterfaceOrientations"] = orientations
          info["UISupportedInterfaceOrientations~ipad"] = orientations

          with open(path, "wb") as f:
              plistlib.dump(info, f)
          print("Info.plist patched")
          EOF

      # --no-sign skips codesigning and packages an unsigned IPA. Building
      # through the tauri CLI (instead of raw xcodebuild) is required: the
      # Xcode "Build Rust Code" phase talks back to the CLI's options server.
      - name: Build unsigned IPA
        run: pnpm tauri ios build --no-sign -v

      - name: Collect IPA
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          IPA=$(find src-tauri/gen/apple -name '*.ipa' | head -1)
          echo "IPA: $IPA"
          mkdir -p dist-ipa
          cp "$IPA" "dist-ipa/Harbor_${VERSION}_unsigned.ipa"
          ls -la dist-ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbor-ios
          path: dist-ipa/*.ipa
          retention-days: 14
          if-no-files-found: error
