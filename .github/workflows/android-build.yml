name: android-build

# Builds a SIGNED Android APK of Harbor (signed with a throwaway CI keystore —
# Android refuses to install unsigned APKs, unlike iOS sideloading).
# Trigger from the Actions tab or:  gh workflow run android-build.yml
# Install: transfer the APK to the phone and open it (allow "unknown sources").

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Android (aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
          key: android

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Set up Android NDK env
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK at: $ANDROID_NDK_LATEST_HOME"

      - name: Initialize Android project
        run: pnpm tauri android init --ci

      # libmpv 1.0.0 requires minSdk 26 (Android 8). Tauri defaults to 24, and
      # a stale generated build.gradle.kts would still say 24, so force it.
      - name: Force minSdk 26 (libmpv requirement)
        run: |
          G=src-tauri/gen/android/app/build.gradle.kts
          test -f "$G"
          sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 26/' "$G"
          grep -n "minSdk" "$G" || true

      - name: Generate app icons (real Harbor icon into the Android mipmaps)
        run: pnpm tauri icon src-tauri/icons/icon.png

      - name: Patch AndroidManifest (cleartext http for debrid/local streams)
        run: |
          M=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          python3 - "$M" <<'EOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          if "usesCleartextTraffic" not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          # Keep the legacy back callback: MainActivity.onBackPressed() is how we
          # route system back into the web app's view stack, and Android 13+
          # predictive back would bypass it.
          if "enableOnBackInvokedCallback" not in s:
              s = s.replace("<application", '<application android:enableOnBackInvokedCallback="false"', 1)
          open(p, "w").write(s)
          print("patched", p)
          EOF

      # Immersive full screen + Android-native back navigation. gen/android is
      # regenerated every build, so our members are appended to the generated
      # activity. Strictly additive — the CLI's own onCreate (which calls
      # enableEdgeToEdge before super) must survive untouched.
      - name: Patch MainActivity (immersive + back navigation)
        run: |
          A=$(find src-tauri/gen/android/app/src/main/java -name MainActivity.kt | head -1)
          echo "MainActivity: $A"
          test -n "$A"
          echo "----- generated -----"; cat "$A"; echo "---------------------"
          python3 scripts/patch-main-activity.py "$A" android/MainActivity-harbor.kt.snippet

      - name: Build APK (release, aarch64)
        run: pnpm tauri android build --apk --target aarch64

      # Signed with the FIXED key committed in android/signing. Android only
      # allows an update when the new APK carries the same signature, so this
      # key must never be regenerated — a fresh one per build (the original
      # mistake) forced an uninstall before every update.
      - name: Sign APK (stable Harbor key)
        run: |
          set -e
          APK=$(find src-tauri/gen/android -name '*-unsigned.apk' -path '*release*' | head -1)
          if [ -z "$APK" ]; then
            # Some tauri versions emit an already-named release apk instead.
            APK=$(find src-tauri/gen/android -name '*.apk' -path '*release*' | head -1)
          fi
          echo "APK: $APK"
          test -n "$APK"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "build-tools: $BT"
          mkdir -p dist
          "$BT/zipalign" -f 4 "$APK" dist/aligned.apk
          "$BT/apksigner" sign \
            --key android/signing/key.pk8 --cert android/signing/cert.x509.pem \
            --out "dist/Harbor_android_signed.apk" dist/aligned.apk
          rm dist/aligned.apk
          "$BT/apksigner" verify --print-certs "dist/Harbor_android_signed.apk"
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbor-android
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            src-tauri/gen/android/app/build/outputs/logs/**
          if-no-files-found: ignore
