name: ios-test

# Freeze-reproduction test in PRODUCTION mode: builds Harbor for the iOS
# SIMULATOR with embedded assets (release rust lib, no dev server — the dev
# proxy parks the main thread by design and would mask the real bug), then
# launches it with the autotest harness (src/lib/autotest.ts) which replays
# the exact sequence that freezes on the phone. The app streams heartbeats
# to a listener on the runner:
#   step=js      webview alive
#   step=native  main_ping round-trip -> native MAIN thread alive
# When native beats stop, the wedged process is sampled (`sample`) to capture
# the stack the main thread is stuck in; everything is uploaded as artifacts.
#
# Trigger:  gh workflow run ios-test.yml

on:
  workflow_dispatch:

jobs:
  freeze-test:
    name: iOS simulator freeze test (release)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
          key: ios-sim-release

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend with autotest baked in
        run: |
          # The harness only activates when this env var exists at build time.
          echo 'VITE_HARBOR_AUTOTEST_URL=https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' > .env.local
          pnpm build
          # Inline boot probe: beacons fire from index.html itself, BEFORE the
          # app bundle runs — pinpoints whether the main JS module ever
          # executes and reports any early error. CSP is null, so inline JS is
          # allowed. Runs before the rust build, which embeds dist/.
          python3 - <<'EOF'
          p = "dist/index.html"
          s = open(p, encoding="utf-8").read()
          probe = """<script>
          (function(){
            function b(step){
              try {
                var u = 'http://127.0.0.1:8765/beat?step=' + encodeURIComponent(step) + '&t=' + Date.now();
                if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) {
                  // No-network channel: lands in UserDefaults, dumped post-mortem.
                  window.__TAURI_INTERNALS__.invoke('plugin:native-player|probe_log', { args: { msg: step } })
                    .catch(function(e){ /* swallowed; HTTP channel may still work */ });
                  window.__TAURI_INTERNALS__.invoke('harbor_fetch', { args: { url: u, method: 'GET', headers: {}, timeoutMs: 3000 } })
                    .catch(function(e){
                      window.__TAURI_INTERNALS__.invoke('plugin:native-player|probe_log', { args: { msg: 'fetch-err:' + String(e).slice(0,100) } }).catch(function(){});
                    });
                }
                fetch(u).catch(function(){});
              } catch (e) {}
            }
            b('inline-boot' + (window.__TAURI_INTERNALS__ ? '-tauri' : '-NOTAURI'));
            window.addEventListener('error', function(e){ b('js-error:' + String(e.message).slice(0,120) + '@' + String(e.filename).slice(-40) + ':' + e.lineno); }, true);
            window.addEventListener('unhandledrejection', function(e){ b('js-rej:' + String(e.reason).slice(0,120)); });
            window.addEventListener('DOMContentLoaded', function(){ b('dom-ready'); });
            setTimeout(function(){ b('inline-alive-3s'); }, 3000);
            setTimeout(function(){ b('inline-alive-10s'); }, 10000);
          })();
          </script>"""
          assert "<head>" in s
          s = s.replace("<head>", "<head>" + probe, 1)
          open(p, "w", encoding="utf-8").write(s)
          print("injected inline probe")
          EOF

      - name: Initialize iOS project
        run: pnpm tauri ios init --ci

      - name: Add MPVKit + replace rust build phase with prebuilt-lib copy
        run: |
          echo "=== project.yml (original) ==="
          cat src-tauri/gen/apple/project.yml
          ruby -ryaml -e '
            path = "src-tauri/gen/apple/project.yml"
            y = YAML.load_file(path)
            (y["packages"] ||= {})["MPVKit"] =
              { "url" => "https://github.com/mpvkit/MPVKit", "exactVersion" => "0.41.0" }
            name, target = y["targets"].find { |k, _| k.end_with?("_iOS") }
            raise "no iOS target found" unless target
            deps = (target["dependencies"] ||= [])
            deps << { "package" => "MPVKit", "product" => "MPVKit" }
            settings = (target["settings"] ||= {})
            base = (settings["base"] ||= {})
            base["LD_RUNPATH_SEARCH_PATHS"] = "$(inherited) @executable_path/Frameworks"
            # The project links `libapp.a` via
            #   LIBRARY_SEARCH_PATHS[arch=arm64] = $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION)
            # so drop the prebuilt rust lib exactly there under the name the
            # linker expects.
            copy = "set -e\n" \
                   "mkdir -p \"$SRCROOT/Externals/arm64/$CONFIGURATION\"\n" \
                   "cp \"$SRCROOT/../../target/aarch64-apple-ios-sim/release/libharbor_lib.a\" " \
                   "\"$SRCROOT/Externals/arm64/$CONFIGURATION/libapp.a\"\n"
            replaced = 0
            walk = lambda { |node|
              case node
              when Hash
                %w[preBuildScripts postCompileScripts postBuildScripts].each do |k|
                  (node[k] || []).each do |s|
                    if s.is_a?(Hash) && s["script"].to_s.include?("xcode-script")
                      s["script"] = copy
                      s["name"] = "Copy prebuilt Rust lib"
                      replaced += 1
                    end
                  end
                end
                node.each_value { |v| walk.call(v) }
              when Array
                node.each { |v| walk.call(v) }
              end
            }
            walk.call(y)
            raise "no xcode-script build phase found to replace" if replaced.zero?
            File.write(path, y.to_yaml)
            puts "patched: replaced #{replaced} script phase(s)"
          '
          brew install xcodegen
          (cd src-tauri/gen/apple && xcodegen generate)

      - name: Patch Info.plist (ATS, orientations)
        run: |
          PLIST=$(find src-tauri/gen/apple -maxdepth 2 -name Info.plist | head -1)
          python3 - "$PLIST" <<'EOF'
          import plistlib, sys
          path = sys.argv[1]
          with open(path, "rb") as f:
              info = plistlib.load(f)
          info["NSAppTransportSecurity"] = {
              "NSAllowsArbitraryLoads": True,
              "NSAllowsLocalNetworking": True,
          }
          orientations = [
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          ]
          info["UISupportedInterfaceOrientations"] = orientations
          info["UISupportedInterfaceOrientations~ipad"] = orientations
          with open(path, "wb") as f:
              plistlib.dump(info, f)
          print("Info.plist patched")
          EOF

      - name: Build Rust staticlib (release, simulator)
        run: cargo build --manifest-path src-tauri/Cargo.toml --lib --release --target aarch64-apple-ios-sim

      - name: Build app for simulator
        run: |
          set -o pipefail
          cd src-tauri/gen/apple
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJ" 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          echo "project=$PROJ scheme=$SCHEME"
          # NOTE: no CODE_SIGNING_ALLOWED=NO — simulator builds ad-hoc sign by
          # default, and a fully unsigned bundle trips security validation
          # (seen as -67056 resource errors in the install log).
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log" | tail -40
          APP=$(find build-sim -name '*.app' -path '*iphonesimulator*' | head -1)
          echo "APP=$PWD/$APP" >> "$GITHUB_ENV"
          ls -la "$APP"

      - name: Start heartbeat listener
        run: |
          cat > beat_server.py <<'EOF'
          import http.server, time
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  with open("beats.log", "a") as f:
                      f.write("%.3f %s\n" % (time.time(), self.path))
                  self.send_response(200)
                  self.send_header("Access-Control-Allow-Origin", "*")
                  self.end_headers()
              def log_message(self, *a):
                  pass
          http.server.ThreadingHTTPServer(("127.0.0.1", 8765), H).serve_forever()
          EOF
          touch beats.log
          nohup python3 beat_server.py > beat_server.log 2>&1 &
          echo "listener up"

      - name: Install and launch in simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]*\(([0-9A-F-]+)\)' | grep -oE '[0-9A-F-]{36}')
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          SIMCTL_CHILD_RUST_BACKTRACE=full SIMCTL_CHILD_RUST_LOG=info \
            nohup xcrun simctl launch --console "$UDID" app.harbor > app-console.log 2>&1 &
          echo "app launched"

      - name: Watch heartbeats / detect freeze
        id: watch
        run: |
          python3 - <<'EOF'
          import re, sys, time, pathlib
          log = pathlib.Path("beats.log")

          def entries():
              out = []
              for line in log.read_text().splitlines():
                  m = re.match(r"([0-9.]+) /beat\?step=([^&]+)", line)
                  if m:
                      out.append((float(m.group(1)), m.group(2)))
              return out

          def wait_for(step, timeout, why):
              t0 = time.time()
              while time.time() - t0 < timeout:
                  if any(s.startswith(step) for _, s in entries()):
                      print(f"[watch] saw {step}")
                      return True
                  time.sleep(2)
              print(f"[watch] TIMEOUT waiting for {step} ({why})")
              return False

          if not wait_for("boot", 180, "app never phoned home"):
              pathlib.Path("freeze_detected").write_text("no-boot")
              sys.exit(1)
          wait_for("native", 30, "no native main_ping beat ever arrived")
          wait_for("phase%3Aplaying", 90, "playback never started (continuing)")
          if not wait_for("phase%3Adestroy", 150, "exit sequence never ran"):
              pathlib.Path("freeze_detected").write_text("no-destroy")
              sys.exit(1)

          print("[watch] monitoring native heartbeats after exit…")
          deadline = time.time() + 35
          while time.time() < deadline:
              es = entries()
              native = [t for t, s in es if s == "native"]
              js = [t for t, s in es if s == "js"]
              now = time.time()
              if native and now - native[-1] > 8:
                  print(f"[watch] FREEZE: last native beat {now - native[-1]:.1f}s ago; "
                        f"js alive: {bool(js and now - js[-1] < 3)}")
                  pathlib.Path("freeze_detected").write_text("freeze")
                  sys.exit(1)
              if any(s.startswith("phase%3Asurvived") for _, s in es):
                  if native and now - native[-1] < 3:
                      print("[watch] SUCCESS: exit survived, native main thread alive")
                      sys.exit(0)
              time.sleep(1)
          es = entries()
          native = [t for t, s in es if s == "native"]
          ok = bool(native and time.time() - native[-1] < 5)
          print(f"[watch] window ended; native alive={ok}")
          sys.exit(0 if ok else 1)
          EOF

      - name: Capture wedged main-thread stack
        if: failure()
        run: |
          echo "--- beats tail ---"; tail -40 beats.log || true
          PID=$(pgrep -xn Harbor || pgrep -n Harbor || true)
          echo "Harbor PID: $PID"
          if [ -n "$PID" ]; then
            sample "$PID" 5 -file sample-mainthread.txt || true
            echo "sample captured"
          fi
          xcrun simctl io booted screenshot freeze.png || true
          # Webview-independent evidence from the app container: the native
          # probe log (UserDefaults) and the JS exit log (WKWebView storage).
          CONT=$(xcrun simctl get_app_container "$UDID" app.harbor data || true)
          echo "container: $CONT"
          if [ -n "$CONT" ]; then
            plutil -p "$CONT/Library/Preferences/app.harbor.plist" > native-probe.txt 2>&1 || true
            mkdir -p webview-storage
            find "$CONT/Library" -path '*LocalStorage*' -exec cp -R {} webview-storage/ \; 2>/dev/null || true
          fi
          # Unified log: page-load failures, custom-scheme errors, WebContent
          # crashes — the ground truth for a black webview.
          xcrun simctl spawn "$UDID" log show --last 20m \
            --predicate 'process == "Harbor" OR process BEGINSWITH "com.apple.WebKit" OR eventMessage CONTAINS[c] "harbor"' \
            --style compact > syslog.txt 2>&1 || true
          wc -l syslog.txt || true
          # Crash reports from the sim processes land on the host.
          mkdir -p crashes
          find "$HOME/Library/Logs/DiagnosticReports" -name '*.ips' -newer xcodebuild.log \
            -exec cp {} crashes/ \; 2>/dev/null || true
          ls -la crashes || true
          # The app's real stdout/stderr (RUST_LOG etc.) — simctl launch
          # points them at data/tmp/launch_console-* files.
          mkdir -p app-stdio
          find "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/tmp" \
            -name 'launch_console-*' -exec cp {} app-stdio/ \; 2>/dev/null || true
          ls -la app-stdio || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freeze-evidence
          path: |
            beats.log
            app-console.log
            beat_server.log
            sample-mainthread.txt
            freeze.png
            xcodebuild.log
            native-probe.txt
            webview-storage/
            syslog.txt
            crashes/
            app-stdio/
          if-no-files-found: ignore
          retention-days: 14
