name: ios-test

# Freeze-reproduction test: builds Harbor for the iOS SIMULATOR on a macOS
# runner, launches it with the autotest harness (src/lib/autotest.ts), and
# replays the exact sequence that freezes on the phone (lock landscape ->
# load -> play -> exit/halt -> unlock orientation -> re-render). The app
# streams heartbeats to a listener on the runner:
#   step=js      webview alive
#   step=native  main_ping round-trip -> native MAIN thread alive
# If native beats stop, the wedged app process is sampled (`sample`) to
# capture the exact stack the main thread is stuck in, and the run fails
# with the evidence uploaded as artifacts.
#
# Trigger:  gh workflow run ios-test.yml

on:
  workflow_dispatch:

jobs:
  freeze-test:
    name: iOS simulator freeze test
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
          key: ios-sim

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Initialize iOS project
        run: pnpm tauri ios init --ci

      - name: Add MPVKit Swift package to the app
        run: |
          ruby -ryaml -e '
            path = "src-tauri/gen/apple/project.yml"
            y = YAML.load_file(path)
            (y["packages"] ||= {})["MPVKit"] =
              { "url" => "https://github.com/mpvkit/MPVKit", "exactVersion" => "0.41.0" }
            name, target = y["targets"].find { |k, _| k.end_with?("_iOS") }
            raise "no iOS target found" unless target
            deps = (target["dependencies"] ||= [])
            deps << { "package" => "MPVKit", "product" => "MPVKit" }
            settings = (target["settings"] ||= {})
            base = (settings["base"] ||= {})
            base["LD_RUNPATH_SEARCH_PATHS"] = "$(inherited) @executable_path/Frameworks"
            File.write(path, y.to_yaml)
            puts "added MPVKit package to #{name}"
          '
          brew install xcodegen
          (cd src-tauri/gen/apple && xcodegen generate)

      - name: Patch Info.plist (ATS, orientations)
        run: |
          PLIST=$(find src-tauri/gen/apple -maxdepth 2 -name Info.plist | head -1)
          python3 - "$PLIST" <<'EOF'
          import plistlib, sys
          path = sys.argv[1]
          with open(path, "rb") as f:
              info = plistlib.load(f)
          info["NSAppTransportSecurity"] = {
              "NSAllowsArbitraryLoads": True,
              "NSAllowsLocalNetworking": True,
          }
          orientations = [
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          ]
          info["UISupportedInterfaceOrientations"] = orientations
          info["UISupportedInterfaceOrientations~ipad"] = orientations
          with open(path, "wb") as f:
              plistlib.dump(info, f)
          print("Info.plist patched")
          EOF

      - name: Configure autotest env + dev server host
        run: |
          # The autotest harness activates only when this env var is present.
          echo 'VITE_HARBOR_AUTOTEST_URL=https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' > .env.local
          # Let vite accept connections regardless of which host tauri picks.
          python3 - <<'EOF'
          import json
          p = "src-tauri/tauri.conf.json"
          c = json.load(open(p))
          c["build"]["beforeDevCommand"] = "npm run dev -- --host 0.0.0.0"
          json.dump(c, open(p, "w"), indent=2)
          print("beforeDevCommand:", c["build"]["beforeDevCommand"])
          EOF

      - name: Start heartbeat listener
        run: |
          cat > beat_server.py <<'EOF'
          import http.server, time
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  with open("beats.log", "a") as f:
                      f.write("%.3f %s\n" % (time.time(), self.path))
                  self.send_response(200)
                  self.send_header("Access-Control-Allow-Origin", "*")
                  self.end_headers()
              def log_message(self, *a):
                  pass
          http.server.ThreadingHTTPServer(("127.0.0.1", 8765), H).serve_forever()
          EOF
          touch beats.log
          nohup python3 beat_server.py > beat_server.log 2>&1 &
          echo "listener up"

      - name: Launch app in simulator (tauri ios dev)
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][^(]*' | head -1 | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          nohup pnpm tauri ios dev "$DEVICE" > tauri-dev.log 2>&1 &
          echo "tauri ios dev started"

      - name: Watch heartbeats / detect freeze
        id: watch
        run: |
          python3 - <<'EOF'
          import re, sys, time, pathlib
          log = pathlib.Path("beats.log")

          def entries():
              out = []
              for line in log.read_text().splitlines():
                  m = re.match(r"([0-9.]+) /beat\?step=([^&]+)", line)
                  if m:
                      out.append((float(m.group(1)), m.group(2)))
              return out

          def wait_for(step, timeout, why):
              t0 = time.time()
              while time.time() - t0 < timeout:
                  if any(s.startswith(step) for _, s in entries()):
                      print(f"[watch] saw {step}")
                      return True
                  time.sleep(2)
              print(f"[watch] TIMEOUT waiting for {step} ({why})")
              return False

          # First build on a cold cache is slow.
          if not wait_for("boot", 2400, "app never launched"):
              sys.exit(2)
          wait_for("phase%3Aplaying", 90, "playback never started (may still proceed)")
          if not wait_for("phase%3Adestroy", 120, "exit sequence never ran"):
              sys.exit(2)

          # Freeze window: native beats must keep flowing for 20s after destroy.
          print("[watch] monitoring native heartbeats after exit…")
          deadline = time.time() + 30
          while time.time() < deadline:
              es = entries()
              native = [t for t, s in es if s == "native"]
              js = [t for t, s in es if s == "js"]
              now = time.time()
              if native and now - native[-1] > 8:
                  print(f"[watch] FREEZE: last native beat {now - native[-1]:.1f}s ago; "
                        f"js alive: {bool(js and now - js[-1] < 3)}")
                  pathlib.Path("freeze_detected").write_text("1")
                  sys.exit(1)
              if any(s.startswith("phase%3Asurvived") for _, s in es):
                  if native and now - native[-1] < 3:
                      print("[watch] SUCCESS: exit survived, native main thread alive")
                      sys.exit(0)
              time.sleep(1)
          print("[watch] window ended without explicit survive marker")
          es = entries()
          native = [t for t, s in es if s == "native"]
          sys.exit(0 if native and time.time() - native[-1] < 5 else 1)
          EOF

      - name: Capture wedged main-thread stack
        if: failure()
        run: |
          echo "--- beats tail ---"; tail -40 beats.log || true
          PID=$(pgrep -xn Harbor || pgrep -n Harbor || true)
          echo "Harbor PID: $PID"
          if [ -n "$PID" ]; then
            sample "$PID" 5 -file sample-mainthread.txt || true
            echo "sample captured"
          fi
          xcrun simctl io booted screenshot freeze.png || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freeze-evidence
          path: |
            beats.log
            tauri-dev.log
            beat_server.log
            sample-mainthread.txt
            freeze.png
          if-no-files-found: ignore
          retention-days: 14
