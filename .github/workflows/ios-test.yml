name: ios-test

# NATIVE freeze-reproduction test on the iOS simulator.
#
# No webview, no JS, no beacons: the Swift plugin itself replays the exact
# sequence that freezes on the phone (lock landscape -> mpv load+play ->
# halt WHILE PLAYING -> unlock/rotate -> reopen -> halt again) when launched
# with HARBOR_NATIVE_AUTOTEST=<video url>. Every step plus a 0.5s main-thread
# liveness ticker is written to the app's UserDefaults (flushed to disk
# immediately); the workflow polls that plist from outside and `sample`s the
# process the moment the ticks stall — capturing the wedged thread's stack.
#
# The app build is the plain release xcodebuild (its webview never runs JS in
# the sim, which is irrelevant here — native code provably runs).
#
# Trigger:  gh workflow run ios-test.yml

on:
  workflow_dispatch:

jobs:
  freeze-test:
    name: iOS simulator native freeze test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
          key: ios-sim-release

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend (embedded assets)
        run: pnpm build

      - name: Initialize iOS project
        run: pnpm tauri ios init --ci

      - name: Add MPVKit + replace rust build phase with prebuilt-lib copy
        run: |
          ruby -ryaml -e '
            path = "src-tauri/gen/apple/project.yml"
            y = YAML.load_file(path)
            (y["packages"] ||= {})["MPVKit"] =
              { "url" => "https://github.com/mpvkit/MPVKit", "exactVersion" => "0.41.0" }
            name, target = y["targets"].find { |k, _| k.end_with?("_iOS") }
            raise "no iOS target found" unless target
            deps = (target["dependencies"] ||= [])
            deps << { "package" => "MPVKit", "product" => "MPVKit" }
            settings = (target["settings"] ||= {})
            base = (settings["base"] ||= {})
            base["LD_RUNPATH_SEARCH_PATHS"] = "$(inherited) @executable_path/Frameworks"
            copy = "set -e\n" \
                   "mkdir -p \"$SRCROOT/Externals/arm64/$CONFIGURATION\"\n" \
                   "cp \"$SRCROOT/../../target/aarch64-apple-ios-sim/release/libharbor_lib.a\" " \
                   "\"$SRCROOT/Externals/arm64/$CONFIGURATION/libapp.a\"\n"
            replaced = 0
            walk = lambda { |node|
              case node
              when Hash
                %w[preBuildScripts postCompileScripts postBuildScripts].each do |k|
                  (node[k] || []).each do |s|
                    if s.is_a?(Hash) && s["script"].to_s.include?("xcode-script")
                      s["script"] = copy
                      s["name"] = "Copy prebuilt Rust lib"
                      replaced += 1
                    end
                  end
                end
                node.each_value { |v| walk.call(v) }
              when Array
                node.each { |v| walk.call(v) }
              end
            }
            walk.call(y)
            raise "no xcode-script build phase found to replace" if replaced.zero?
            File.write(path, y.to_yaml)
            puts "patched: replaced #{replaced} script phase(s)"
          '
          brew install xcodegen
          (cd src-tauri/gen/apple && xcodegen generate)

      - name: Patch Info.plist (ATS, orientations)
        run: |
          PLIST=$(find src-tauri/gen/apple -maxdepth 2 -name Info.plist | head -1)
          python3 - "$PLIST" <<'EOF'
          import plistlib, sys
          path = sys.argv[1]
          with open(path, "rb") as f:
              info = plistlib.load(f)
          info["NSAppTransportSecurity"] = {
              "NSAllowsArbitraryLoads": True,
              "NSAllowsLocalNetworking": True,
          }
          orientations = [
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          ]
          info["UISupportedInterfaceOrientations"] = orientations
          info["UISupportedInterfaceOrientations~ipad"] = orientations
          with open(path, "wb") as f:
              plistlib.dump(info, f)
          print("Info.plist patched")
          EOF

      - name: Build Rust staticlib (release, simulator)
        run: cargo build --manifest-path src-tauri/Cargo.toml --lib --release --target aarch64-apple-ios-sim

      - name: Build app for simulator
        run: |
          set -o pipefail
          cd src-tauri/gen/apple
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJ" 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          echo "project=$PROJ scheme=$SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim build \
            2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log" | tail -25
          APP=$(find build-sim -name '*.app' -path '*iphonesimulator*' | head -1)
          echo "APP=$PWD/$APP" >> "$GITHUB_ENV"
          ls -la "$APP"

      - name: Prepare test media (served from the runner)
        run: |
          # The googleapis sample bucket 403s GitHub runners; Blender's own
          # server has hosted these files for 15+ years. Serve locally so the
          # sim (which shares the host loopback) streams with zero flakiness.
          mkdir -p testmedia
          curl -fL --retry 3 -o testmedia/test.mp4 \
            https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_320x180.mp4
          ls -la testmedia
          nohup python3 -m http.server 8880 --directory testmedia > media_server.log 2>&1 &
          sleep 1
          curl -sI http://127.0.0.1:8880/test.mp4 | head -3

      - name: Install and launch with native autotest
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]*\(([0-9A-F-]+)\)' | grep -oE '[0-9A-F-]{36}')
          echo "Simulator UDID: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          SIMCTL_CHILD_HARBOR_NATIVE_AUTOTEST="http://127.0.0.1:8880/test.mp4" \
            xcrun simctl launch "$UDID" app.harbor
          echo "app launched"

      - name: Watch native probe / detect freeze
        id: watch
        run: |
          CONT=$(xcrun simctl get_app_container "$UDID" app.harbor data)
          echo "container: $CONT"
          PROBE="$CONT/Documents/probe.log"
          echo "PROBE=$PROBE" >> "$GITHUB_ENV"
          python3 - "$PROBE" <<'EOF'
          import pathlib, sys, time

          probe = pathlib.Path(sys.argv[1])

          def lines():
              try:
                  return probe.read_text().splitlines()
              except Exception:
                  return []

          def has(prefix, ls):
              return any(l.split("  ", 1)[-1].startswith(prefix) for l in ls)

          # Wait for the autotest to arm (app boot).
          t0 = time.time()
          while time.time() - t0 < 240:
              ls = lines()
              if has("autotest: armed", ls):
                  print("[watch] autotest armed")
                  break
              time.sleep(2)
          else:
              print("[watch] app never armed the autotest"); sys.exit(2)

          # Follow the run: succeed on SURVIVED, fail when the log stalls
          # after a halt (the liveness ticker should append every 0.5s).
          last_len, last_change = 0, time.time()
          deadline = time.time() + 180
          while time.time() < deadline:
              ls = lines()
              if len(ls) != last_len:
                  for l in ls[last_len:]:
                      print("  " + l)
                  last_len, last_change = len(ls), time.time()
              if has("autotest: SURVIVED", ls):
                  print("[watch] SURVIVED — no freeze")
                  sys.exit(0)
              stalled = time.time() - last_change
              if has("autotest: halt", ls) and stalled > 8:
                  print(f"[watch] FREEZE: probe log stalled {stalled:.1f}s after halt")
                  sys.exit(1)
              if stalled > 60:
                  print(f"[watch] STALL: no probe progress for {stalled:.1f}s")
                  sys.exit(1)
              time.sleep(1)
          print("[watch] timeout"); sys.exit(2)
          EOF

      - name: Capture evidence
        if: failure()
        timeout-minutes: 8
        run: |
          PID=$(pgrep -xn Harbor || pgrep -n Harbor || true)
          echo "Harbor PID: $PID"
          if [ -n "$PID" ]; then
            sample "$PID" 5 -file sample-mainthread.txt || true
            echo "sample captured"
          fi
          xcrun simctl io "$UDID" screenshot freeze.png || true
          cp "$PROBE" native-probe.txt 2>/dev/null || true
          cat native-probe.txt || true
          mkdir -p crashes
          find "$HOME/Library/Logs/DiagnosticReports" -name '*.ips' -newer xcodebuild.log \
            -exec cp {} crashes/ \; 2>/dev/null || true
          ls -la crashes || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freeze-evidence
          path: |
            sample-mainthread.txt
            freeze.png
            native-probe.txt
            xcodebuild.log
            crashes/
          if-no-files-found: ignore
          retention-days: 14
