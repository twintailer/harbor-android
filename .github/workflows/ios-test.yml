name: ios-test

# Freeze-reproduction test in PRODUCTION mode: builds Harbor for the iOS
# SIMULATOR with embedded assets (release rust lib, no dev server — the dev
# proxy parks the main thread by design and would mask the real bug), then
# launches it with the autotest harness (src/lib/autotest.ts) which replays
# the exact sequence that freezes on the phone. The app streams heartbeats
# to a listener on the runner:
#   step=js      webview alive
#   step=native  main_ping round-trip -> native MAIN thread alive
# When native beats stop, the wedged process is sampled (`sample`) to capture
# the stack the main thread is stuck in; everything is uploaded as artifacts.
#
# Trigger:  gh workflow run ios-test.yml

on:
  workflow_dispatch:

jobs:
  freeze-test:
    name: iOS simulator freeze test (release)
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri
          key: ios-sim-release

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend with autotest baked in
        run: |
          # The harness only activates when this env var exists at build time.
          echo 'VITE_HARBOR_AUTOTEST_URL=https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' > .env.local
          pnpm build

      - name: Initialize iOS project
        run: pnpm tauri ios init --ci

      - name: Add MPVKit + replace rust build phase with prebuilt-lib copy
        run: |
          echo "=== project.yml (original) ==="
          cat src-tauri/gen/apple/project.yml
          ruby -ryaml -e '
            path = "src-tauri/gen/apple/project.yml"
            y = YAML.load_file(path)
            (y["packages"] ||= {})["MPVKit"] =
              { "url" => "https://github.com/mpvkit/MPVKit", "exactVersion" => "0.41.0" }
            name, target = y["targets"].find { |k, _| k.end_with?("_iOS") }
            raise "no iOS target found" unless target
            deps = (target["dependencies"] ||= [])
            deps << { "package" => "MPVKit", "product" => "MPVKit" }
            settings = (target["settings"] ||= {})
            base = (settings["base"] ||= {})
            base["LD_RUNPATH_SEARCH_PATHS"] = "$(inherited) @executable_path/Frameworks"
            # Find the static lib the project links so the copy lands exactly
            # where the linker looks for it.
            lib = deps.filter_map { |d| d["framework"] }.find { |f| f.to_s.end_with?(".a") }
            raise "no static lib dependency found in project.yml" unless lib
            copy = "set -e\nmkdir -p \"$SRCROOT/#{File.dirname(lib)}\"\n" \
                   "cp \"$SRCROOT/../../target/aarch64-apple-ios-sim/release/libharbor_lib.a\" \"$SRCROOT/#{lib}\"\n"
            replaced = 0
            walk = lambda { |node|
              case node
              when Hash
                %w[preBuildScripts postCompileScripts postBuildScripts].each do |k|
                  (node[k] || []).each do |s|
                    if s.is_a?(Hash) && s["script"].to_s.include?("xcode-script")
                      s["script"] = copy
                      s["name"] = "Copy prebuilt Rust lib"
                      replaced += 1
                    end
                  end
                end
                node.each_value { |v| walk.call(v) }
              when Array
                node.each { |v| walk.call(v) }
              end
            }
            walk.call(y)
            raise "no xcode-script build phase found to replace" if replaced.zero?
            File.write(path, y.to_yaml)
            puts "patched: lib=#{lib}, replaced #{replaced} script phase(s)"
          '
          brew install xcodegen
          (cd src-tauri/gen/apple && xcodegen generate)

      - name: Patch Info.plist (ATS, orientations)
        run: |
          PLIST=$(find src-tauri/gen/apple -maxdepth 2 -name Info.plist | head -1)
          python3 - "$PLIST" <<'EOF'
          import plistlib, sys
          path = sys.argv[1]
          with open(path, "rb") as f:
              info = plistlib.load(f)
          info["NSAppTransportSecurity"] = {
              "NSAllowsArbitraryLoads": True,
              "NSAllowsLocalNetworking": True,
          }
          orientations = [
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          ]
          info["UISupportedInterfaceOrientations"] = orientations
          info["UISupportedInterfaceOrientations~ipad"] = orientations
          with open(path, "wb") as f:
              plistlib.dump(info, f)
          print("Info.plist patched")
          EOF

      - name: Build Rust staticlib (release, simulator)
        run: cargo build --manifest-path src-tauri/Cargo.toml --lib --release --target aarch64-apple-ios-sim

      - name: Build app for simulator
        run: |
          cd src-tauri/gen/apple
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJ" 2>/dev/null | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          echo "project=$PROJ scheme=$SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build | tail -40
          APP=$(find build-sim -name '*.app' -path '*iphonesimulator*' | head -1)
          echo "APP=$PWD/$APP" >> "$GITHUB_ENV"
          ls -la "$APP"

      - name: Start heartbeat listener
        run: |
          cat > beat_server.py <<'EOF'
          import http.server, time
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  with open("beats.log", "a") as f:
                      f.write("%.3f %s\n" % (time.time(), self.path))
                  self.send_response(200)
                  self.send_header("Access-Control-Allow-Origin", "*")
                  self.end_headers()
              def log_message(self, *a):
                  pass
          http.server.ThreadingHTTPServer(("127.0.0.1", 8765), H).serve_forever()
          EOF
          touch beats.log
          nohup python3 beat_server.py > beat_server.log 2>&1 &
          echo "listener up"

      - name: Install and launch in simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]*\(([0-9A-F-]+)\)' | grep -oE '[0-9A-F-]{36}')
          echo "Simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          nohup xcrun simctl launch --console "$UDID" app.harbor > app-console.log 2>&1 &
          echo "app launched"

      - name: Watch heartbeats / detect freeze
        id: watch
        run: |
          python3 - <<'EOF'
          import re, sys, time, pathlib
          log = pathlib.Path("beats.log")

          def entries():
              out = []
              for line in log.read_text().splitlines():
                  m = re.match(r"([0-9.]+) /beat\?step=([^&]+)", line)
                  if m:
                      out.append((float(m.group(1)), m.group(2)))
              return out

          def wait_for(step, timeout, why):
              t0 = time.time()
              while time.time() - t0 < timeout:
                  if any(s.startswith(step) for _, s in entries()):
                      print(f"[watch] saw {step}")
                      return True
                  time.sleep(2)
              print(f"[watch] TIMEOUT waiting for {step} ({why})")
              return False

          if not wait_for("boot", 180, "app never phoned home"):
              pathlib.Path("freeze_detected").write_text("no-boot")
              sys.exit(1)
          wait_for("native", 30, "no native main_ping beat ever arrived")
          wait_for("phase%3Aplaying", 90, "playback never started (continuing)")
          if not wait_for("phase%3Adestroy", 150, "exit sequence never ran"):
              pathlib.Path("freeze_detected").write_text("no-destroy")
              sys.exit(1)

          print("[watch] monitoring native heartbeats after exit…")
          deadline = time.time() + 35
          while time.time() < deadline:
              es = entries()
              native = [t for t, s in es if s == "native"]
              js = [t for t, s in es if s == "js"]
              now = time.time()
              if native and now - native[-1] > 8:
                  print(f"[watch] FREEZE: last native beat {now - native[-1]:.1f}s ago; "
                        f"js alive: {bool(js and now - js[-1] < 3)}")
                  pathlib.Path("freeze_detected").write_text("freeze")
                  sys.exit(1)
              if any(s.startswith("phase%3Asurvived") for _, s in es):
                  if native and now - native[-1] < 3:
                      print("[watch] SUCCESS: exit survived, native main thread alive")
                      sys.exit(0)
              time.sleep(1)
          es = entries()
          native = [t for t, s in es if s == "native"]
          ok = bool(native and time.time() - native[-1] < 5)
          print(f"[watch] window ended; native alive={ok}")
          sys.exit(0 if ok else 1)
          EOF

      - name: Capture wedged main-thread stack
        if: failure()
        run: |
          echo "--- beats tail ---"; tail -40 beats.log || true
          PID=$(pgrep -xn Harbor || pgrep -n Harbor || true)
          echo "Harbor PID: $PID"
          if [ -n "$PID" ]; then
            sample "$PID" 5 -file sample-mainthread.txt || true
            echo "sample captured"
          fi
          xcrun simctl io booted screenshot freeze.png || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freeze-evidence
          path: |
            beats.log
            app-console.log
            beat_server.log
            sample-mainthread.txt
            freeze.png
          if-no-files-found: ignore
          retention-days: 14
