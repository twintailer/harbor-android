[package]
name = "tauri-plugin-native-player"
version = "0.1.0"
description = "Native VLCKit-based video playback behind the webview on iOS"
edition = "2021"
links = "tauri-plugin-native-player"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
